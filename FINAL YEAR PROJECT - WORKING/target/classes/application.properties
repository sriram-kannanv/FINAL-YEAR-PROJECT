# ===========================================================================
# IoT Baseline — Existing System Configuration
# Review 2: Conventional IoT-Cloud Architecture (Chapter 3)
# ===========================================================================

spring.application.name=iot-baseline

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# SQLite Database
# NOTE: This local SQLite database represents the "cloud storage" layer
#       for the local demonstration. In production, this would be replaced
#       by an actual cloud database (AWS RDS, Azure SQL, Google Cloud SQL).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:./iot_baseline.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# MQTT Configuration
# NOTE: Plaintext connection on localhost:1883.
#       TLS is NOT enabled for this local demonstration.
#       See application-tls.properties for TLS configuration template.
#       In a production deployment, TLS (ssl://host:8883) should be used.
# ---------------------------------------------------------------------------
mqtt.broker.url=tcp://localhost:1883
mqtt.broker.clientId=iot-baseline-backend
mqtt.broker.topic.subscribe=iot/sensor/#
mqtt.broker.topic.publish=iot/sensor
mqtt.broker.connection.timeout=30
mqtt.broker.keep.alive=60
mqtt.tls.enabled=false
mqtt.tls.description=UNENCRYPTED - localhost only - TLS not active for demo

# Embedded Moquette broker settings
mqtt.embedded.broker.enabled=true
mqtt.embedded.broker.port=1883
mqtt.embedded.broker.host=localhost
mqtt.embedded.broker.data.dir=./mqtt-data

# ---------------------------------------------------------------------------
# Sensor Simulator
# ---------------------------------------------------------------------------
simulator.default.device.id=ESP32-DEMO-001
simulator.default.device.name=Demo ESP32 Sensor Node
simulator.default.secret.key=demo-secret-key-2024
simulator.default.interval.seconds=5
simulator.temperature.min=18.0
simulator.temperature.max=42.0
simulator.humidity.min=35.0
simulator.humidity.max=90.0

# ---------------------------------------------------------------------------
# Security — Dashboard Login
# Default credentials for Review 2 demo.
# IMPORTANT: Change these before any production use.
# ---------------------------------------------------------------------------
app.security.admin.username=admin
app.security.admin.password=admin123
app.security.remember.me.key=iot-baseline-remember-me-key

# ---------------------------------------------------------------------------
# Device Monitoring
# ---------------------------------------------------------------------------
monitoring.device.inactive.threshold.seconds=60
monitoring.stats.history.hours=24

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.fyp.iotbaseline=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.io.moquette=WARN
